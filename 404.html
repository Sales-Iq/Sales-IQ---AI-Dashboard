<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ 404</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<link rel="preconnect" href="https://cdn.tailwindcss.com" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { inter: ['Inter', 'system-ui', 'sans-serif'] },
        boxShadow: { glow: '0 0 35px rgba(56,189,248,.25)' },
        animation: {
          floaty: 'floaty 7s ease-in-out infinite',
          shimmer: 'shimmer 2.6s linear infinite',
          pulseSoft: 'pulseSoft 2.8s ease-in-out infinite',
          slideUp: 'slideUp .65s cubic-bezier(.2,.9,.2,1) both'
        },
        keyframes: {
          floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-18px)' } },
          shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
          pulseSoft: { '0%,100%': { opacity: '.65', transform: 'scale(1)' }, '50%': { opacity: '1', transform: 'scale(1.04)' } },
          slideUp: { '0%': { opacity: '0', transform: 'translateY(22px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/liquid-glass.css" />

</head>
<body class="font-inter bg-slate-950 text-white overflow-x-hidden">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen"><div class="splash-orb"></div><h2>SalesIQ</h2><p>Loading intelligent dashboard...</p></div>

<section class="min-h-screen flex items-center justify-center p-5"><div class="glass-strong max-w-xl p-8 text-center animate-slideUp"><div class="text-7xl animate-floaty">🛰️</div><h1 class="text-6xl font-black tracking-tight mt-4">404</h1><p class="text-slate-400 mt-3">This page got lost in the inventory warehouse.</p><button id="backDashboard" class="btn btn-primary mt-6">Back to Dashboard</button></div></section>

  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="js/liquid-glass.js"></script>
<script type="module" src="js/shared.js"></script>
  <script type="module">import { auth } from "./js/firebase-config.js";import { getAccountProfile } from "./js/account.js";import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";document.getElementById("backDashboard").onclick=()=>onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const p=await getAccountProfile(u).catch(()=>null);const r=p?.role||"Sales Staff";location.href=r==="Sales Staff"?"sales/dashboard.html":"admin/dashboard.html";});</script>
</body>
</html>

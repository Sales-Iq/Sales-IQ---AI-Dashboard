<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ 404</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="SalesIQ — AI powered sales, inventory and forecasting dashboard." />
<meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="css/tailwind.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/liquid-glass.css" />

</head>
<body class="font-inter bg-slate-950 text-white overflow-x-hidden">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>

<section class="min-h-screen flex items-center justify-center p-5"><div class="glass-strong max-w-xl p-8 text-center animate-slideUp"><div class="text-7xl animate-floaty">🛰️</div><h1 class="text-6xl font-black tracking-tight mt-4">404</h1><p class="text-slate-400 mt-3">This page got lost in the inventory warehouse.</p><button id="backDashboard" class="btn btn-primary mt-6">Back to Dashboard</button></div></section>

  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="js/liquid-glass.js" defer></script>
<script type="module" src="js/shared.js"></script>
  <script type="module">import { auth } from "./js/firebase-config.js";import { getAccountProfile } from "./js/account.js";import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";document.getElementById("backDashboard").onclick=()=>onAuthStateChanged(auth,async u=>{if(!u)return location.href="login.html";const p=await getAccountProfile(u).catch(()=>null);const r=p?.role||"Sales Staff";location.href=r==="Sales Staff"?"sales/dashboard.html":"admin/dashboard.html";});</script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>SalesIQ - Product Batches</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { inter: ["Inter", "system-ui", "sans-serif"] },
            animation: {
              floaty: "floaty 7s ease-in-out infinite",
              shimmer: "shimmer 2.6s linear infinite",
              pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
              slideUp: "slideUp .65s cubic-bezier(.2,.9,.2,1) both",
            },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".65", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.04)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(22px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/liquid-glass.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body
    class="font-inter bg-slate-950 text-slate-100 app-body"
    data-role="admin"
    data-active="batches"
  >
    <div id="animatedBg" class="animated-bg"></div>
    <div id="splashScreen" class="splash-screen">
      <div class="splash-orb"></div>
      <h2>SalesIQ</h2>
      <p>Opening SalesIQ - Product Batches...</p>
    </div>
    <div class="app-shell">
      <aside id="appSidebar" class="app-sidebar"></aside>
      <div class="app-main">
        <header id="appHeader" class="app-header"></header>
        <main class="page-container animate-slideUp">
          <div
            class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"
          >
            <div>
              <h2 class="page-title">Product Batches</h2>
              <p class="page-subtitle">
                Manage product batches with manufacture/expiry dates, FEFO selling, and disposal tracking.
              </p>
            </div>
            <div class="flex flex-wrap gap-3">
              <button class="btn btn-primary" id="openBatchModal">
                + Add Batch
              </button>
            </div>
          </div>
          <div class="glass p-5 mb-5 grid md:grid-cols-4 gap-4">
            <input
              id="batchSearch"
              class="input"
              placeholder="Search batch number..."
            />
            <select id="batchProductFilter" class="select">
              <option value="">All Products</option>
            </select>
            <select id="batchStatusFilter" class="select">
              <option value="">All Status</option>
              <option value="Active">Active</option>
              <option value="Near Expiry">Near Expiry</option>
              <option value="Expired">Expired</option>
              <option value="Disposed">Disposed</option>
              <option value="Empty">Empty</option>
            </select>
            <button id="refreshBatches" class="btn btn-ghost">Refresh</button>
          </div>
          <div class="glass p-5">
            <div id="batchesTable"></div>
          </div>

          <!-- Batch Modal -->
          <div id="batchModal" class="modal-backdrop">
            <div class="modal-card glass-strong p-6 max-w-2xl">
              <div class="flex justify-between items-center mb-5">
                <h3 class="text-2xl font-black" id="batchModalTitle">Add Batch</h3>
                <button class="btn btn-ghost btn-sm" data-close-modal>✕</button>
              </div>
              <form id="batchForm" class="form-grid space-y-4">
                <input type="hidden" id="batchId" />
                <input type="hidden" id="batchProductId" />

                <div class="md:col-span-2">
                  <label class="label" for="batchProductSelect">
                    Product <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <select class="select" id="batchProductSelect" required>
                    <option value="">Select a product</option>
                  </select>
                </div>

                <div class="md:col-span-2">
                  <label class="label" for="batchNumber">
                    Batch Number <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <input class="input" id="batchNumber" type="text" placeholder="e.g., PCM-2026-04" required />
                </div>

                <div class="md:col-span-2 grid md:grid-cols-2 gap-4">
                  <div>
                    <label class="label" for="batchManufactureDate">
                      Manufacture Date <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input class="input" id="batchManufactureDate" type="date" required />
                  </div>
                  <div>
                    <label class="label" for="batchExpiryDate">
                      Expiry Date <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input class="input" id="batchExpiryDate" type="date" required />
                  </div>
                </div>

                <div class="md:col-span-2 grid md:grid-cols-2 gap-4">
                  <div>
                    <label class="label" for="batchPurchasedQty">
                      Purchased Quantity <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input class="input" id="batchPurchasedQty" type="number" min="1" required />
                  </div>
                  <div>
                    <label class="label" for="batchRemainingQty">
                      Remaining Quantity
                    </label>
                    <input class="input" id="batchRemainingQty" type="number" min="0" readonly />
                  </div>
                </div>

                <div>
                  <label class="label" for="batchSupplier">
                    Supplier Name <span class="optional-mark">(Optional)</span>
                  </label>
                  <input class="input" id="batchSupplier" type="text" />
                </div>

                <div>
                  <label class="label" for="batchPurchasePrice">
                    Purchase Price <span class="optional-mark">(Optional)</span>
                  </label>
                  <input class="input" id="batchPurchasePrice" type="number" min="0" step="0.01" />
                </div>

                <div id="disposalSection" class="md:col-span-2 hidden border-t border-slate-700/50 pt-4">
                  <h4 class="font-bold mb-3 text-amber-400">Disposal Record</h4>
                  <div class="grid md:grid-cols-3 gap-4">
                    <div>
                      <label class="label" for="batchDisposalQty">
                        Disposed Quantity <span class="required-mark" aria-hidden="true">*</span>
                      </label>
                      <input class="input" id="batchDisposalQty" type="number" min="1" />
                    </div>
                    <div>
                      <label class="label" for="batchDisposalReason">
                        Reason <span class="required-mark" aria-hidden="true">*</span>
                      </label>
                      <select class="select" id="batchDisposalReason" required>
                        <option value="">Select reason</option>
                        <option value="expired">Expired</option>
                        <option value="damaged">Damaged</option>
                        <option value="recalled">Recalled</option>
                        <option value="other">Other</option>
                      </select>
                    </div>
                    <div>
                      <label class="label" for="batchDisposalDate">
                        Disposal Date <span class="required-mark" aria-hidden="true">*</span>
                      </label>
                      <input class="input" id="batchDisposalDate" type="date" required />
                    </div>
                  </div>
                  <div>
                    <label class="label" for="batchDisposalNotes">Notes</label>
                    <textarea class="input" id="batchDisposalNotes" rows="2" placeholder="Additional details..."></textarea>
                  </div>
                </div>

                <div class="md:col-span-2 flex gap-3">
                  <button type="button" class="btn btn-danger" id="disposeBatchBtn" hidden>Record Disposal</button>
                  <button class="btn btn-primary w-full" type="submit" id="saveBatchBtn">Save Batch</button>
                </div>
              </form>
            </div>
          </div>

          <!-- Batch Detail Modal -->
          <div id="batchDetailModal" class="modal-backdrop">
            <div class="modal-card glass-strong p-6 max-w-3xl">
              <div class="flex justify-between items-center mb-5">
                <h3 class="text-2xl font-black">Batch Details</h3>
                <button class="btn btn-ghost btn-sm" data-close-detail>✕</button>
              </div>
              <div id="batchDetailContent"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
    <div id="toastRoot" class="toast-root"></div>
    <script src="../js/fallback-ui.js"></script>
    <script src="../js/liquid-glass.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="js/batches.js"></script>
  </body>
</html>

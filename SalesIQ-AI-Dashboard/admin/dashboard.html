<!doctype html>
<html lang="en">
  <head>
    <title>SalesIQ - Admin Dashboard</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { inter: ["Inter", "system-ui", "sans-serif"] },
            animation: {
              floaty: "floaty 7s ease-in-out infinite",
              shimmer: "shimmer 2.6s linear infinite",
              pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
              slideUp: "slideUp .65s cubic-bezier(.2,.9,.2,1) both",
            },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".65", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.04)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(22px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/liquid-glass.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body
    class="font-inter bg-slate-950 text-slate-100 app-body"
    data-role="admin"
    data-active="dashboard"
  >
    <div id="animatedBg" class="animated-bg"></div>
    <div id="splashScreen" class="splash-screen hidden"></div>
    <div class="app-shell">
      <aside id="appSidebar" class="app-sidebar"></aside>
      <div class="app-main">
        <header id="appHeader" class="app-header"></header>
        <main class="page-container animate-slideUp">
          <div
            class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"
          >
            <div>
              <h2 class="page-title">Admin Dashboard</h2>
              <p class="page-subtitle">
                Live business overview with staff sales and optional dummy live
                demo data.
              </p>
            </div>
            <div class="flex flex-wrap gap-3"></div>
          </div>

          <div
            class="glass p-5 mb-6 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4"
          >
            <div>
              <h3 class="font-black text-xl mb-1">Dummy Live Data</h3>
              <p id="demoLiveStatus" class="text-slate-300 leading-7">Checking demo mode...</p>
              <p class="text-xs text-slate-400 mt-1">
                Dummy sales use demo products only and are saved in the same
                sales collection with source = dummy.
              </p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <button id="seedDemoProducts" class="btn btn-ghost">
                Seed / Restock Products
              </button>

              <div class="flex items-center gap-2">
                <label for="bulkSaleCount" class="text-xs text-slate-400">Sales:</label>
                <select id="bulkSaleCount" class="input w-28">
                  <option value="1" selected>1 sale</option>
                  <option value="10">10 sales</option>
                  <option value="100">100 sales</option>
                  <option value="1000">1000 sales</option>
                </select>
                <button id="generateBulkSales" class="btn btn-success">
                  Generate
                </button>
              </div>

              <button id="toggleDemoLive" class="btn btn-primary">
                Live Demo
              </button>
            </div>
          </div>
          <div class="stats-grid mb-6" id="adminStats"></div>
          <div class="grid xl:grid-cols-2 gap-6 mb-6">
            <div class="glass chart-box">
              <h3 class="font-black mb-3">Sales Chart</h3>
              <canvas id="salesTrendChart"></canvas>
            </div>
            <div class="glass chart-box">
              <h3 class="font-black mb-3">Inventory Chart</h3>
              <canvas id="inventoryChart"></canvas>
            </div>
          </div>
          <div class="grid xl:grid-cols-3 gap-6">
            <div class="glass p-5 xl:col-span-2">
              <h3 class="font-black mb-4">Recent Sales</h3>
              <div id="recentSales"></div>
            </div>
            <div class="glass p-5">
              <h3 class="font-black mb-4">AI Business Summary</h3>
              <div id="aiSummary" class="text-slate-300 leading-7"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <canvas
      id="clickSparkCanvas"
      class="click-spark-canvas"
      aria-hidden="true"
    ></canvas>
    <div id="toastRoot" class="toast-root"></div>
    <script src="../js/fallback-ui.js"></script>
    <script src="../js/liquid-glass.js"></script>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>

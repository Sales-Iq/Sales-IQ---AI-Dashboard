<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - Add Sale</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { inter: ['Inter','system-ui','sans-serif'] }, animation: { floaty:'floaty 7s ease-in-out infinite', shimmer:'shimmer 2.6s linear infinite', pulseSoft:'pulseSoft 2.8s ease-in-out infinite', slideUp:'slideUp .65s cubic-bezier(.2,.9,.2,1) both' }, keyframes: { floaty:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-18px)'}}, shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}, pulseSoft:{'0%,100%':{opacity:'.65',transform:'scale(1)'},'50%':{opacity:'1',transform:'scale(1.04)'}}, slideUp:{'0%':{opacity:'0',transform:'translateY(22px)'},'100%':{opacity:'1',transform:'translateY(0)'}} } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/liquid-glass.css" />
<link rel="stylesheet" href="css/admin.css" />


</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="add-sale">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">
        <div class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"><div><h2 class="page-title">Add Sale / Billing</h2><p class="page-subtitle">Create invoice, reduce stock automatically and save sale in Firestore.</p></div><div class="flex flex-wrap gap-3"></div></div>
<div class="grid xl:grid-cols-3 gap-6">
  <form id="billingForm" class="glass p-6 xl:col-span-2 form-grid">
    <div class="md:col-span-2"><label class="label">Select Product</label><select id="saleProduct" class="select" required><option value="">Choose product</option></select></div>
    <div><label class="label">Price</label><input id="salePrice" class="input" type="number" readonly></div>
    <div><label class="label">Available Stock</label><input id="saleStock" class="input" type="number" readonly></div>
    <div><label class="label">Quantity Sold</label><input id="saleQty" class="input" type="number" min="1" value="1" required></div>
    <div><label class="label">Total Amount</label><input id="saleTotal" class="input" type="number" readonly></div>
    <div><label class="label">Customer Name</label><input id="customerName" class="input" placeholder="Customer name" required></div>
    <div><label class="label">Payment Method</label><select id="paymentMethod" class="select"><option>Cash</option><option>UPI</option><option>Card</option><option>Net Banking</option></select></div>
    <div class="md:col-span-2"><button class="btn btn-primary w-full" type="submit">Generate Invoice & Save Sale</button></div>
  </form>
  <div class="glass p-6"><h3 class="font-black text-xl mb-4">Invoice Preview</h3><div id="invoicePreview" class="space-y-3 text-slate-300"></div><button id="printInvoice" class="btn btn-ghost w-full mt-5">Print Invoice</button></div>
</div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js"></script>
  <script src="../js/liquid-glass.js"></script>
  <script type="module" src="js/add-sale.js"></script>
</body>
</html>

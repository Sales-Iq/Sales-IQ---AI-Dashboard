<!doctype html>
<html lang="en">
  <head>
    <title>SalesIQ - Products</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { inter: ["Inter", "system-ui", "sans-serif"] },
            animation: {
              floaty: "floaty 7s ease-in-out infinite",
              shimmer: "shimmer 2.6s linear infinite",
              pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
              slideUp: "slideUp .65s cubic-bezier(.2,.9,.2,1) both",
            },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".65", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.04)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(22px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/liquid-glass.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body
    class="font-inter bg-slate-950 text-slate-100 app-body"
    data-role="admin"
    data-active="products"
  >
    <div id="animatedBg" class="animated-bg"></div>
    <div id="splashScreen" class="splash-screen hidden"></div>
    <div class="app-shell">
      <aside id="appSidebar" class="app-sidebar"></aside>
      <div class="app-main">
        <header id="appHeader" class="app-header"></header>
        <main class="page-container animate-slideUp">
          <div
            class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"
          >
            <div>
              <h2 class="page-title">Product Management</h2>
              <p class="page-subtitle">
                Add, edit, delete and track product status.
              </p>
            </div>
            <div class="flex flex-wrap gap-3">
              <button class="btn btn-primary" id="openProductModal">
                + Add Product
              </button>
            </div>
          </div>
          <div class="glass p-5 mb-5 grid md:grid-cols-3 gap-4">
            <input
              id="productSearch"
              class="input"
              placeholder="Search product..."
            /><input
              id="categoryFilter"
              class="input"
              placeholder="Filter category..."
            /><button id="refreshProducts" class="btn btn-ghost">
              Refresh
            </button>
          </div>
          <div class="glass p-5"><div id="productsTable"></div></div>
          <div id="productModal" class="modal-backdrop">
            <div class="modal-card glass-strong p-6">
              <div class="flex justify-between items-center mb-5">
                <h3 class="text-2xl font-black" id="productModalTitle">
                  Add Product
                </h3>
                <button class="btn btn-ghost btn-sm" data-close-modal>✕</button>
              </div>
              <form id="productForm" class="form-grid">
                <input type="hidden" id="productId" />

                <p class="required-note">
                  Fields marked with
                  <span class="required-mark" aria-hidden="true">*</span>
                  are compulsory.
                </p>

                <div>
                  <label class="label" for="productName">
                    Product Name
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <input class="input" id="productName" type="text" required />
                </div>

                <div>
                  <label class="label" for="productCategory">
                    Category
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <select class="select" id="productCategory" required>
                    <option value="">Select category</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Audio">Audio</option>
                    <option value="Wearables">Wearables</option>
                    <option value="Bags">Bags</option>
                    <option value="Food">Food</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <!-- Only displayed for Food and Medicine -->
                <div
                  id="productDateFields"
                  class="md:col-span-2 grid md:grid-cols-2 gap-4"
                  hidden
                >
                  <div>
                    <label class="label" for="productManufactureDate">
                      Manufacture Date
                      <span class="required-mark" aria-hidden="true">*</span>
                    </label>

                    <input
                      class="input"
                      id="productManufactureDate"
                      type="date"
                    />
                  </div>

                  <div>
                    <label class="label" for="productExpiryDate">
                      Expiry Date
                      <span class="required-mark" aria-hidden="true">*</span>
                    </label>

                    <input class="input" id="productExpiryDate" type="date" />
                  </div>
                </div>

                <div>
                  <label class="label" for="productPrice">
                    Selling Price
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <input
                    class="input"
                    id="productPrice"
                    type="number"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>

                <div>
                  <label class="label" for="productCost">
                    Cost Price
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <input
                    class="input"
                    id="productCost"
                    type="number"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>

                <div>
                  <label class="label" for="productStock">
                    Stock Quantity
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <input
                    class="input"
                    id="productStock"
                    type="number"
                    min="0"
                    required
                  />
                </div>

                <div>
                  <label class="label" for="productMinStock">
                    Minimum Stock Limit
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>

                  <input
                    class="input"
                    id="productMinStock"
                    type="number"
                    min="0"
                    required
                  />
                </div>

                <div>
                  <label class="label" for="productSupplier">
                    Supplier Name
                    <span class="optional-mark">(Optional)</span>
                  </label>

                  <input class="input" id="productSupplier" type="text" />
                </div>

                <div>
                  <label class="label" for="productImage">
                    Product Image URL
                    <span class="optional-mark">(Optional)</span>
                  </label>

                  <input
                    class="input"
                    id="productImage"
                    type="url"
                    placeholder="https://..."
                  />
                </div>

                <div class="md:col-span-2">
                  <button class="btn btn-primary w-full" type="submit">
                    Save Product
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <canvas
      id="clickSparkCanvas"
      class="click-spark-canvas"
      aria-hidden="true"
    ></canvas>
    <div id="toastRoot" class="toast-root"></div>
    <script src="../js/fallback-ui.js"></script>
    <script src="../js/liquid-glass.js"></script>
    <script type="module" src="js/products.js"></script>
  </body>
</html>

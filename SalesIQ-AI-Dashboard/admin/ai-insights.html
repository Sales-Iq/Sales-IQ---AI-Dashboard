<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - AI Insights</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { inter: ['Inter','system-ui','sans-serif'] }, animation: { floaty:'floaty 7s ease-in-out infinite', shimmer:'shimmer 2.6s linear infinite', pulseSoft:'pulseSoft 2.8s ease-in-out infinite', slideUp:'slideUp .65s cubic-bezier(.2,.9,.2,1) both' }, keyframes: { floaty:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-18px)'}}, shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}, pulseSoft:{'0%,100%':{opacity:'.65',transform:'scale(1)'},'50%':{opacity:'1',transform:'scale(1.04)'}}, slideUp:{'0%':{opacity:'0',transform:'translateY(22px)'},'100%':{opacity:'1',transform:'translateY(0)'}} } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/liquid-glass.css" />
<link rel="stylesheet" href="css/admin.css" />


</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="ai-insights">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">
        <div class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"><div><h2 class="page-title">AI Insights</h2><p class="page-subtitle">Gemini powered sales summary, inventory suggestions and business Q&A.</p></div><div class="flex flex-wrap gap-3"></div></div>
<div class="grid xl:grid-cols-3 gap-6">
  <div class="glass p-6 xl:col-span-2"><h3 class="font-black text-xl mb-4">Ask AI Business Questions</h3><textarea id="aiQuestion" class="textarea h-36" placeholder="Which product should I restock first?"></textarea><div class="flex flex-wrap gap-3 mt-4"><button class="btn btn-primary" data-ai-question="summary">Generate Business Summary</button><button class="btn btn-warn" data-ai-question="restock">Restock Advice</button><button class="btn btn-success" data-ai-question="profit">Profit Tips</button><button class="btn btn-ghost" id="askAiBtn">Ask AI</button></div><div id="aiAnswer" class="glass p-5 mt-5 leading-7 whitespace-pre-wrap"></div></div>
  <div class="space-y-6"><div class="glass p-6"><h3 class="font-black text-xl mb-2">Gemini API Key</h3><p class="text-sm text-slate-400 mb-3">Saved only in this browser (localStorage). Never committed to git. For production use a backend proxy (<code>GEMINI_PROXY_URL</code>).</p><div class="flex items-center gap-2 mb-3"><span id="geminiKeyStatus"></span><a class="text-xs underline text-slate-300" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Get a free key</a></div><input id="geminiKeyInput" type="password" class="input w-full" placeholder="Paste Gemini API key" autocomplete="off" spellcheck="false" /><div class="flex flex-wrap gap-3 mt-3"><button class="btn btn-primary" id="saveGeminiKeyBtn">Save Key</button><button class="btn btn-ghost" id="clearGeminiKeyBtn">Remove</button></div></div><div class="glass p-6"><h3 class="font-black text-xl mb-4">Example Questions</h3><div class="space-y-3" id="exampleQuestions"></div></div></div>
</div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js"></script>
  <script src="../js/liquid-glass.js"></script>
  <script type="module" src="js/ai-insights.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - Reports</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="SalesIQ — AI powered sales, inventory and forecasting dashboard." />
<meta name="theme-color" content="#0f172a" />
    <link rel="stylesheet" href="../css/tailwind.css" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/liquid-glass.css" />
<link rel="stylesheet" href="css/admin.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="reports">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">
        <div class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"><div><h2 class="page-title">Reports</h2><p class="page-subtitle">Download sales, inventory, low stock, profit and performance reports.</p></div><div class="flex flex-wrap gap-3"><button id="exportAllJson" class="btn btn-ghost">Backup JSON</button></div></div>
<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5" id="reportCards"></div>
<div class="glass p-5 mt-6"><h3 class="font-black mb-4">Report Preview</h3><div id="reportPreview"></div></div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js" defer></script>
  <script src="../js/liquid-glass.js" defer></script>
<script type="module" src="../js/shared.js"></script>
  <script type="module" src="js/reports.js"></script>
</body>
</html>

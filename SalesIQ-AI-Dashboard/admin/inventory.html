<!doctype html>
<html lang="en">
  <head>
    <title>SalesIQ - Inventory</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { inter: ["Inter", "system-ui", "sans-serif"] },
            animation: {
              floaty: "floaty 7s ease-in-out infinite",
              shimmer: "shimmer 2.6s linear infinite",
              pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
              slideUp: "slideUp .65s cubic-bezier(.2,.9,.2,1) both",
            },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".65", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.04)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(22px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/liquid-glass.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body
    class="font-inter bg-slate-950 text-slate-100 app-body"
    data-role="admin"
    data-active="inventory"
  >
    <div id="animatedBg" class="animated-bg"></div>
    <div id="splashScreen" class="splash-screen hidden"></div>
    <div class="app-shell">
      <aside id="appSidebar" class="app-sidebar"></aside>
      <div class="app-main">
        <header id="appHeader" class="app-header"></header>
        <main class="page-container animate-slideUp">
          <div
            class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"
          >
            <div>
              <h2 class="page-title">Inventory</h2>
              <p class="page-subtitle">
                Stock list, alerts, movement and stock updates.
              </p>
            </div>
            <div class="flex flex-wrap gap-3">
              <button id="generateStockAlerts" class="btn btn-warn">
                Generate Alerts
              </button>
            </div>
          </div>
          <div class="stats-grid mb-6" id="inventoryStats"></div>
          <div class="glass p-5 mb-5 grid md:grid-cols-4 gap-4">
            <input
              id="inventorySearch"
              class="input"
              placeholder="Search product..."
            /><select id="inventoryCategory" class="select">
              <option value="">All categories</option></select
            ><select id="inventoryStatus" class="select">
              <option value="">All status</option>
              <option>Available</option>
              <option>Low Stock</option>
              <option>Out of Stock</option></select
            ><button id="refreshInventory" class="btn btn-ghost">
              Refresh
            </button>
          </div>
          <div class="grid xl:grid-cols-4 gap-6 mb-6">
            <div class="glass p-5 xl:col-span-3 min-w-0">
              <h3 class="font-black mb-4">Current Stock List</h3>
              <div id="inventoryTable"></div>
            </div>
            <div class="glass p-5">
              <h3 class="font-black mb-4">Fast / Slow Moving Products</h3>
              <div id="movementList"></div>
            </div>
          </div>
          <div id="stockModal" class="modal-backdrop">
            <div class="modal-card glass-strong p-6">
              <div class="flex justify-between items-center mb-5">
                <h3 class="text-2xl font-black">Update Stock</h3>
                <button class="btn btn-ghost btn-sm" data-close-modal>✕</button>
              </div>
              <form id="stockForm" class="space-y-4">
                <input type="hidden" id="stockProductId" />
                <div>
                  <label class="label">Product</label
                  ><input id="stockProductName" class="input" disabled />
                </div>
                <div>
                  <label class="label">New Stock Quantity</label
                  ><input
                    id="stockNewQty"
                    class="input"
                    type="number"
                    min="0"
                    required
                  />
                </div>
                <button class="btn btn-primary w-full">Update Stock</button>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <canvas
      id="clickSparkCanvas"
      class="click-spark-canvas"
      aria-hidden="true"
    ></canvas>
    <div id="toastRoot" class="toast-root"></div>
    <script src="../js/fallback-ui.js"></script>
    <script src="../js/liquid-glass.js"></script>
    <script type="module" src="js/inventory.js"></script>
  </body>
</html>

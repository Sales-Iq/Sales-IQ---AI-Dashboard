<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - Analytics</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { inter: ['Inter','system-ui','sans-serif'] }, animation: { floaty:'floaty 7s ease-in-out infinite', shimmer:'shimmer 2.6s linear infinite', pulseSoft:'pulseSoft 2.8s ease-in-out infinite', slideUp:'slideUp .65s cubic-bezier(.2,.9,.2,1) both' }, keyframes: { floaty:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-18px)'}}, shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}, pulseSoft:{'0%,100%':{opacity:'.65',transform:'scale(1)'},'50%':{opacity:'1',transform:'scale(1.04)'}}, slideUp:{'0%':{opacity:'0',transform:'translateY(22px)'},'100%':{opacity:'1',transform:'translateY(0)'}} } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/liquid-glass.css" />
<link rel="stylesheet" href="css/admin.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="analytics">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">
        <div class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"><div><h2 class="page-title">Analytics</h2><p class="page-subtitle">Charts and reports from real Firestore sales data.</p></div><div class="flex flex-wrap gap-3"></div></div>
<div class="grid xl:grid-cols-2 gap-6 mb-6"><div class="glass chart-box"><h3 class="font-black mb-3">Daily Sales Trend</h3><canvas id="dailySalesChart"></canvas></div><div class="glass chart-box"><h3 class="font-black mb-3">Monthly Sales</h3><canvas id="monthlySalesChart"></canvas></div><div class="glass chart-box"><h3 class="font-black mb-3">Top Selling Products</h3><canvas id="topProductsChart"></canvas></div><div class="glass chart-box"><h3 class="font-black mb-3">Category-wise Sales</h3><canvas id="categorySalesChart"></canvas></div><div class="glass chart-box"><h3 class="font-black mb-3">Revenue Growth Area</h3><canvas id="revenueChart"></canvas></div><div class="glass chart-box"><h3 class="font-black mb-3">Profit Chart</h3><canvas id="profitChart"></canvas></div></div>
<div class="glass p-5"><h3 class="font-black mb-4">Least-selling Products & Stock Movement</h3><div id="leastProducts"></div></div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js"></script>
  <script src="../js/liquid-glass.js"></script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>

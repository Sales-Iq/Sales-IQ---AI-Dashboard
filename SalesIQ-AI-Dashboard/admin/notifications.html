<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - Notifications</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SalesIQ — AI powered sales, inventory and forecasting dashboard." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/liquid-glass.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="notifications">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen hidden"></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">

        <!-- Top Header & Global Actions -->
        <div class="mb-6 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4">
          <div>
            <h2 class="page-title">Notifications & Alerts</h2>
            <p class="page-subtitle">Real-time low stock warnings, sales transactions, restock logs, and store updates.</p>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <button id="markAllRead" class="btn btn-success flex items-center gap-2">
              <span>✓</span>
              <span>Mark All Read</span>
            </button>
            <button id="clearRead" class="btn btn-danger flex items-center gap-2">
              <span>🗑️</span>
              <span>Clear Read</span>
            </button>
          </div>
        </div>

        <!-- Notification KPI Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="glass p-4 rounded-2xl flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-xl flex-shrink-0">
              🔔
            </div>
            <div>
              <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total Alerts</div>
              <div id="statTotalCount" class="text-2xl font-black text-slate-100">0</div>
            </div>
          </div>

          <div class="glass p-4 rounded-2xl flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-xl flex-shrink-0">
              ✉️
            </div>
            <div>
              <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Unread</div>
              <div id="statUnreadCount" class="text-2xl font-black text-amber-400">0</div>
            </div>
          </div>

          <div class="glass p-4 rounded-2xl flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-xl flex-shrink-0">
              ⚠️
            </div>
            <div>
              <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Stock Alerts</div>
              <div id="statStockCount" class="text-2xl font-black text-rose-400">0</div>
            </div>
          </div>

          <div class="glass p-4 rounded-2xl flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-xl flex-shrink-0">
              📅
            </div>
            <div>
              <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Today's Activity</div>
              <div id="statTodayCount" class="text-2xl font-black text-emerald-400">0</div>
            </div>
          </div>
        </div>

        <!-- Controls: Filter Tabs & Live Search -->
        <div class="glass p-4 rounded-2xl mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <!-- Filter Tabs -->
          <div id="filterTabs" class="flex flex-wrap gap-2">
            <button data-filter="all" class="btn btn-sm btn-primary filter-tab active">
              All (<span id="tabCountAll">0</span>)
            </button>
            <button data-filter="unread" class="btn btn-sm btn-ghost filter-tab">
              Unread (<span id="tabCountUnread">0</span>)
            </button>
            <button data-filter="stock" class="btn btn-sm btn-ghost filter-tab">
              ⚠️ Stock (<span id="tabCountStock">0</span>)
            </button>
            <button data-filter="sale" class="btn btn-sm btn-ghost filter-tab">
              🧾 Sales (<span id="tabCountSale">0</span>)
            </button>
            <button data-filter="purchase" class="btn btn-sm btn-ghost filter-tab">
              ➕ Restock (<span id="tabCountPurchase">0</span>)
            </button>
          </div>

          <!-- Live Search Input -->
          <div class="relative w-full md:w-72">
            <input
              id="searchAlerts"
              class="input w-full text-sm pl-9"
              placeholder="Search notifications..."
            />
            <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
          </div>
        </div>

        <!-- Notifications List Container -->
        <div class="glass p-6 rounded-2xl">
          <div id="notificationsList" class="space-y-3"></div>
        </div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js" defer></script>
  <script src="../js/liquid-glass.js" defer></script>
  <script type="module" src="../js/shared.js"></script>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <title>SalesIQ - Sales Dashboard</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SalesIQ — AI powered sales, inventory and forecasting dashboard." />
<meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { inter: ["Inter", "system-ui", "sans-serif"] },
            animation: {
              floaty: "floaty 7s ease-in-out infinite",
              shimmer: "shimmer 2.6s linear infinite",
              pulseSoft: "pulseSoft 2.8s ease-in-out infinite",
              slideUp: "slideUp .65s cubic-bezier(.2,.9,.2,1) both",
            },
            keyframes: {
              floaty: {
                "0%,100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200% 0" },
                "100%": { backgroundPosition: "200% 0" },
              },
              pulseSoft: {
                "0%,100%": { opacity: ".65", transform: "scale(1)" },
                "50%": { opacity: "1", transform: "scale(1.04)" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(22px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/liquid-glass.css" />
    <link rel="stylesheet" href="css/sales.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  </head>
  <body
    class="font-inter bg-slate-950 text-slate-100 app-body"
    data-role="sales"
    data-active="dashboard"
  >
    <div id="animatedBg" class="animated-bg"></div>
    <div id="splashScreen" class="splash-screen hidden"></div>
    <div class="app-shell">
      <aside id="appSidebar" class="app-sidebar"></aside>
      <div class="app-main">
        <header id="appHeader" class="app-header"></header>
        <main class="page-container animate-slideUp">
          <div
            class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"
          >
            <div>
              <h2 class="page-title">Sales Staff Dashboard</h2>
              <p class="page-subtitle flex items-center gap-2">
                Personal sales performance and basic stock overview.
                <span
                  id="connectionBadge"
                  class="hidden text-xs px-2 py-1 rounded-md"
                ></span>
              </p>
            </div>
            <div class="flex flex-wrap gap-3"></div>
          </div>

          <div
            id="staffInvitationBanner"
            class="hidden mb-6 p-4 rounded-xl border border-blue-500/50 bg-blue-500/10 flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center"
          >
            <div>
              <h3
                class="text-blue-400 font-bold text-lg mb-1 flex items-center gap-2"
              >
                <span>✉️</span> New Connection Request
              </h3>
              <p id="staffInvitationText" class="text-slate-300 text-sm">
                Admin Name (admin@email.com) has invited you to join their staff
                team.
              </p>
            </div>
            <div class="flex gap-3 whitespace-nowrap">
              <button
                id="acceptInviteBtn"
                class="btn bg-blue-600 hover:bg-blue-500 text-white btn-sm"
              >
                Accept Request
              </button>
              <button
                id="rejectInviteBtn"
                class="btn btn-ghost btn-sm text-red-400 hover:text-red-300"
              >
                Reject
              </button>
            </div>
          </div>

          <div class="stats-grid mb-6" id="staffStats"></div>
          <div class="grid xl:grid-cols-2 gap-6">
            <div class="glass chart-box">
              <h3 class="font-black mb-3">My Performance</h3>
              <div class="chart-wrap"><canvas id="staffChart"></canvas></div>
            </div>
            <div class="glass p-5">
              <h3 class="font-black mb-4">Recent Sales</h3>
              <div id="staffRecentSales"></div>
            </div>
          </div>
          <div class="glass p-5 mt-6">
            <h3 class="font-black mb-4">Basic Stock View</h3>
            <div id="staffStock"></div>
          </div>
        </main>
      </div>
    </div>
    <canvas
      id="clickSparkCanvas"
      class="click-spark-canvas"
      aria-hidden="true"
    ></canvas>
    <div id="toastRoot" class="toast-root"></div>
    <script src="../js/fallback-ui.js" defer></script>
    <script src="../js/liquid-glass.js" defer></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>

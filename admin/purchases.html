<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ - Purchases</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { inter: ['Inter','system-ui','sans-serif'] }, animation: { floaty:'floaty 7s ease-in-out infinite', shimmer:'shimmer 2.6s linear infinite', pulseSoft:'pulseSoft 2.8s ease-in-out infinite', slideUp:'slideUp .65s cubic-bezier(.2,.9,.2,1) both' }, keyframes: { floaty:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-18px)'}}, shimmer:{'0%':{backgroundPosition:'-200% 0'},'100%':{backgroundPosition:'200% 0'}}, pulseSoft:{'0%,100%':{opacity:'.65',transform:'scale(1)'},'50%':{opacity:'1',transform:'scale(1.04)'}}, slideUp:{'0%':{opacity:'0',transform:'translateY(22px)'},'100%':{opacity:'1',transform:'translateY(0)'}} } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/shared.css" />
<link rel="stylesheet" href="../css/liquid-glass.css" />
<link rel="stylesheet" href="css/admin.css" />


</head>
<body class="font-inter bg-slate-950 text-slate-100 app-body" data-role="admin" data-active="purchases">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen"><div class="splash-orb"></div><h2>SalesIQ</h2><p>Opening SalesIQ - Purchases...</p></div>
  <div class="app-shell">
    <aside id="appSidebar" class="app-sidebar"></aside>
    <div class="app-main">
      <header id="appHeader" class="app-header"></header>
      <main class="page-container animate-slideUp">
        <div class="mb-7 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4"><div><h2 class="page-title">Purchase / Restock</h2><p class="page-subtitle">Add stock to inventory and save restock history.</p></div><div class="flex flex-wrap gap-3"></div></div>
<div class="grid xl:grid-cols-3 gap-6"><form id="purchaseForm" class="glass p-6 xl:col-span-1 space-y-4"><div><label class="label">Select Product</label><select id="purchaseProduct" class="select" required><option value="">Choose product</option></select></div><div><label class="label">Batch Number</label><input id="purchaseBatchNumber" class="input" placeholder="e.g., BATCH-2026-001" required></div><div><label class="label">Manufacture Date</label><input id="purchaseManufactureDate" class="input" type="date" required></div><div><label class="label">Expiry Date</label><input id="purchaseExpiryDate" class="input" type="date" required></div><div><label class="label">Purchase Quantity</label><input id="purchaseQty" class="input" type="number" min="1" required></div><div><label class="label">Supplier Name</label><input id="purchaseSupplier" class="input"></div><div><label class="label">Purchase Price (per unit)</label><input id="purchasePrice" class="input" type="number" min="0" step="0.01" required></div><div><label class="label">Purchase Date</label><input id="purchaseDate" class="input" type="date"></div><button class="btn btn-primary w-full">Add Stock</button></form><div class="glass p-5 xl:col-span-2"><h3 class="font-black mb-4">Restock History</h3><div id="purchasesTable"></div></div></div>

      </main>
    </div>
  </div>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="../js/fallback-ui.js"></script>
  <script src="../js/liquid-glass.js"></script>
<script type="module" src="../js/shared.js"></script>
  <script type="module" src="js/purchases.js"></script>
</body>
</html>

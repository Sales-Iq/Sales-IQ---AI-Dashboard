<!DOCTYPE html>
<html lang="en">
<head>
  <title>SalesIQ Register</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{ inter:['Inter','system-ui','sans-serif'] } } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/liquid-glass.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="font-inter bg-slate-950 text-white overflow-x-hidden">
  <div id="animatedBg" class="animated-bg"></div>
  <div id="splashScreen" class="splash-screen"><div class="splash-orb"></div><h2>SalesIQ</h2><p>Creating your workspace...</p></div>
  <section class="auth-scene">
    <div class="auth-grid-bg"></div>
    <div class="auth-orb one"></div>
    <div class="auth-orb two"></div>
    <div class="auth-cube one"></div>
    <div class="auth-cube two"></div>
    <div class="auth-card large">
      <a href="index.html" class="auth-brand"><span class="auth-logo">SIQ</span><span>SalesIQ</span></a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Register as Admin, Manager, or Sales Staff.</p>
      <form id="registerForm" class="auth-form">
        <div class="auth-form-row"><label>Full Name</label><input class="input" type="text" id="regName" required placeholder="Your name"></div>
        <div class="auth-form-row"><label>Email</label><input class="input" type="email" id="regEmail" required placeholder="you@example.com"></div>
        <div class="auth-form-row"><label>Password</label><input class="input" type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters"></div>
        <div class="auth-form-row"><label>Role</label><select class="select" id="regRole"><option>Admin</option><option>Sales Staff</option><option>Manager</option></select></div>
        <button class="btn btn-primary auth-main-btn" type="submit">Create Account</button>
      </form>
      <div class="auth-divider"><span></span><p>OR</p><span></span></div>
      <button id="googleRegister" class="google-3d" type="button"><span>G</span> Register with Google</button>
      <p class="auth-bottom">Already have account? <a href="login.html">Login</a></p>
      <a class="auth-back" href="index.html">← Back to home</a>
    </div>
  </section>
  <canvas id="clickSparkCanvas" class="click-spark-canvas" aria-hidden="true"></canvas>
  <div id="toastRoot" class="toast-root"></div>
  <script src="js/liquid-glass.js"></script>
  <script src="js/auth-3d.js"></script>
  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
